site_name: Orlando Family Vacation 2026
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
extra_css:
  - assets/checklist.css
  - assets/activity-card.css
  - assets/display-mode.css
  - assets/day-navigator.css
  - assets/production-day.css
  - assets/production-day-v1.0.1.css
  - assets/revisit.css
  - assets/full-site.css
  - assets/release-candidate.css
  - assets/theme-route-maps.css
  - assets/route-maps.css
  - assets/pretrip-polish.css
extra_javascript:
  - assets/vacation-api-config.js
  - assets/checklist.js
  - assets/display-mode.js
  - assets/trip-app.js
  - assets/production-day.js
  - assets/pretrip-polish.js
  - assets/live-park-data.js
nav:
  - Home: index.md
  - Daily Plans:
      - Aug 9 — Typhoon Lagoon: disney/day-01-typhoon-lagoon.md
      - Aug 10 — Animal Kingdom & Hollywood Studios: disney/day-02-animal-kingdom-hollywood.md
      - Aug 11 — Magic Kingdom: disney/day-03-magic-kingdom.md
      - Aug 12 — Epic Universe: universal/day-04-epic-universe.md
      - Aug 13 — Islands of Adventure: universal/day-05-islands-of-adventure.md
      - Aug 14 — Universal Studios Florida: universal/day-06-universal-studios.md
      - Aug 15 — Departure: universal/day-07-departure.md
  - Park Overviews:
      - Disney: disney/overview.md
      - Universal: universal/overview.md
  - Revisit List: revisit.md
  - Planning:
      - Checklist: pre-trip-checklist.md
      - Lightning Lane: lightning-lane.md
      - Dining: dining.md
      - Transportation: transportation.md
      - Disney Maps: disney/park-maps.md
      - Souvenir Strategy: souvenir-strategy.md
      - Documentation Conventions: style-guide.md
  - About:
      - Change Log: changelog.md
